name: RDP

on:
  workflow_dispatch:

jobs:
  rdp-job:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install .NET Framework 3.5
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Installing .NET Framework 3.5..."

          try {
              Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -ErrorAction Stop
              Write-Host ".NET Framework 3.5 enabled."
          }
          catch {
              Write-Warning "Unable to install .NET Framework 3.5 on this runner."
          }

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $password = -join ((33..126) | Get-Random -Count 16 | ForEach-Object { [char]$_ })

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser `
                  -Name "RDP" `
                  -Password $securePassword `
                  -AccountNeverExpires

              Add-LocalGroupMember -Group "Administrators" -Member "RDP"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          }

          "RDP_USER=RDP" >> $env:GITHUB_ENV
          "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $msi = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait

          if (!(Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
              throw "Tailscale installation failed."
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" version

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              throw "TAILSCALE_AUTH_KEY is empty."
          }

          Start-Service Tailscale -ErrorAction SilentlyContinue

          $service = Get-Service Tailscale

          $timeout = 30

          while ($service.Status -ne "Running" -and $timeout -gt 0) {
              Start-Sleep -Seconds 1
              $service.Refresh()
              $timeout--
          }

          if ($service.Status -ne "Running") {
              throw "Tailscale service failed to start."
          }

          Write-Host "Connecting to Tailscale..."

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
              --authkey="$env:TS_AUTHKEY" `
              --hostname="gh-runner-${{ github.run_id }}" `
              --accept-routes=false `
              --accept-dns=false

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {
              $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null)

              if ($ip) {
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (!$ip) {
              Write-Host "Tailscale status:"
              & "$env:ProgramFiles\Tailscale\tailscale.exe" status
              throw "Failed to obtain Tailscale IP."
          }

          "TS_IP=$ip" >> $env:GITHUB_ENV

      - name: Show Connection Info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=================================="
          Write-Host "RDP READY"
          Write-Host "=================================="
          Write-Host "IP Address : $env:TS_IP"
          Write-Host "Username   : $env:RDP_USER"
          Write-Host "Password   : $env:RDP_PASS"
          Write-Host "=================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          1..72 | ForEach-Object {
              Write-Host "[$(Get-Date)] Runner is alive..."
              Start-Sleep -Seconds 300
          }
