name: Ubuntu-Terminal-RDP

on:
  workflow_dispatch:

jobs:
  ubuntu-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install XRDP and Terminal
        run: |
          sudo apt update
          sudo apt install -y xrdp xterm
          
          # Configure xterm as default
          echo "xterm" > ~/.xsession
          sudo cp ~/.xsession /etc/skel/
          sudo systemctl restart xrdp

      - name: Create User
        run: |
          PASSWORD=$(openssl rand -base64 8)
          sudo useradd -m -s /bin/bash user
          echo "user:$PASSWORD" | sudo chpasswd
          echo "RDP_USER=user" >> $GITHUB_ENV
          echo "RDP_PASS=$PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}
          TS_IP=$(sudo tailscale ip -4)
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV

      - name: Show Info
        run: |
          echo ""
          echo "✅ Terminal Access Ready"
          echo "IP: $TS_IP"
          echo "User: user"
          echo "Pass: $RDP_PASS"
          echo ""

      - name: Keep Alive
        run: sleep 6h
